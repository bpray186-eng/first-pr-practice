name: Validate and merge contributor PRs

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - Contributors.md
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to validate and merge
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: contributor-pr-${{ github.event.pull_request.number || inputs.pull_number }}
  cancel-in-progress: true

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate contribution and merge
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- first-contributions-auto-merge -->';
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request?.number || Number(context.payload.inputs.pull_number);
            const pullRequest = context.payload.pull_request || (await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber
            })).data;

            async function upsertFeedback(body) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: pullNumber, per_page: 100 }
              );
              const existing = comments.find(comment =>
                comment.user.type === 'Bot' && comment.body?.includes(marker)
              );
              const markedBody = `${marker}\n${body}`;

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: markedBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pullNumber,
                  body: markedBody
                });
              }
            }

            function copilotPrompt(prompt) {
              return `\n\n**Paste this into GitHub Copilot Chat:**\n\n` +
                `\`\`\`text\n${prompt}\n\`\`\``;
            }

            if (pullRequest.state !== 'open') {
              core.setFailed(`Pull request #${pullNumber} is not open.`);
              return;
            }

            if (pullRequest.draft) {
              await upsertFeedback(
                `### Your pull request is still a draft\n\n` +
                `Hi @${pullRequest.user.login}, a draft tells reviewers that you are still working. ` +
                `The contributor check waits until you mark the pull request as ready for review. ` +
                `Review the **Files changed** tab first, then select **Ready for review**.` +
                copilotPrompt(
                  `Review the changes in my current pull request. Confirm that it adds exactly my ` +
                  `name to Contributors.md in alphabetical order and changes no other files. Show ` +
                  `me the diff, and if it is correct, mark the pull request as ready for review.`
                )
              );
              return;
            }

            if (pullRequest.base.ref !== context.payload.repository.default_branch) {
              await upsertFeedback(
                `### Your pull request targets the wrong branch\n\n` +
                `Hi @${pullRequest.user.login}, the base branch is where GitHub will apply your ` +
                `change after the pull request is merged. This pull request targets ` +
                `\`${pullRequest.base.ref}\`, but this exercise uses ` +
                `\`${context.payload.repository.default_branch}\`.` +
                copilotPrompt(
                  `Change pull request #${pullNumber} in ${owner}/${repo} so its base branch is ` +
                  `${context.payload.repository.default_branch}. Do not change my contributor ` +
                  `entry. Then show me the updated pull request details.`
                )
              );
              core.setFailed('The pull request must target the default branch.');
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pullNumber, per_page: 100 }
            );
            const contributorFile = files.find(file => file.filename === 'Contributors.md');
            const onlyContributorFile = files.length === 1 && contributorFile;

            if (!onlyContributorFile) {
              const changedFiles = files.map(file => `- \`${file.filename}\``).join('\n');
              await upsertFeedback(
                `### Please update your contribution\n\n` +
                `Hi @${pullRequest.user.login}, this exercise expects only ` +
                `\`Contributors.md\` to change. A pull request follows its branch, so you can fix ` +
                `this without opening a new pull request: restore the unrelated files, commit the ` +
                `correction, and push it to the same branch.\n\n**Files currently changed:**\n${changedFiles}` +
                copilotPrompt(
                  `On my current pull request branch, keep only the intended change that adds my ` +
                  `name to Contributors.md. Restore every other changed file to match the base ` +
                  `branch. Do not remove anyone else's contributor entry. Show me the diff before ` +
                  `you commit, then commit the correction and push it to this same branch.`
                )
              );
              core.setFailed('The pull request must change only Contributors.md.');
              return;
            }

            const addedLines = (contributorFile.patch || '')
              .split('\n')
              .filter(line => line.startsWith('+') && !line.startsWith('+++'))
              .map(line => line.slice(1));
            const contributorPattern = /^- [^\s\r\n](?:.*[^\s\r\n])?$/;
            const isOneValidEntry =
              contributorFile.additions === 1 &&
              contributorFile.deletions === 0 &&
              addedLines.length === 1 &&
              contributorPattern.test(addedLines[0]);

            if (!isOneValidEntry) {
              await upsertFeedback(
                `### Please update your contribution\n\n` +
                `Hi @${pullRequest.user.login}, your pull request should add exactly one line to ` +
                `\`Contributors.md\` and remove nothing. Each contributor is a Markdown list item ` +
                `with one space after the dash. Use this format:\n\n` +
                '```markdown\n- Your Name\n```\n\n' +
                `Push the correction to the same branch. GitHub will update this pull request and ` +
                `run the check again automatically.` +
                copilotPrompt(
                  `Fix Contributors.md on my current pull request branch. Add exactly one line for ` +
                  `my name using the format "- Your Name", with my real name in place of "Your ` +
                  `Name". Do not remove or edit any existing contributor. Put my line in ` +
                  `alphabetical order, show me the diff, then commit and push the correction to ` +
                  `this same branch.`
                )
              );
              core.setFailed('The pull request must add exactly one valid contributor entry.');
              return;
            }

            const addedName = addedLines[0].slice(2);
            const headFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'Contributors.md',
              ref: pullRequest.head.sha
            });
            const content = Buffer.from(headFile.data.content, 'base64').toString('utf8');
            const contributorNames = content
              .split(/\r?\n/)
              .filter(line => line.startsWith('- '))
              .map(line => line.slice(2));
            const duplicateCount = contributorNames.filter(
              name => name.localeCompare(addedName, 'en', { sensitivity: 'base' }) === 0
            ).length;

            if (duplicateCount !== 1) {
              await upsertFeedback(
                `### Please remove the duplicate entry\n\n` +
                `Hi @${pullRequest.user.login}, \`${addedName}\` already appears in ` +
                `\`Contributors.md\`. Contributor names should appear once. If the existing entry is ` +
                `yours, no new change is needed and you can close this pull request.` +
                copilotPrompt(
                  `Check Contributors.md and confirm whether ${addedName} already exists on the ` +
                  `base branch. If it does, remove only the duplicate line added by my branch, show ` +
                  `me the diff, and explain how to close this pull request because I am already ` +
                  `listed. Do not remove the original entry.`
                )
              );
              core.setFailed('The contributor entry must be unique.');
              return;
            }

            const sortedNames = [...contributorNames].sort((left, right) =>
              left.localeCompare(right, 'en', { sensitivity: 'base' })
            );
            const isAlphabetical = contributorNames.every(
              (name, index) => name === sortedNames[index]
            );

            if (!isAlphabetical) {
              await upsertFeedback(
                `### Please alphabetize your entry\n\n` +
                `Hi @${pullRequest.user.login}, your line has the correct format, but the contributor ` +
                `list must stay in alphabetical order by name. Move \`- ${addedName}\` to the ` +
                `correct position, then commit and push to this same branch. The pull request will ` +
                `update automatically.` +
                copilotPrompt(
                  `Move the existing "- ${addedName}" line in Contributors.md into alphabetical ` +
                  `order by contributor name. Keep every contributor exactly once and do not change ` +
                  `any other file. Show me the diff, then commit and push the correction to this ` +
                  `same pull request branch.`
                )
              );
              core.setFailed('Contributor entries must remain in alphabetical order.');
              return;
            }

            const latest = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber
            });

            if (latest.data.mergeable === false || latest.data.mergeable_state === 'dirty') {
              await postConflictFeedback();
              core.setFailed('The pull request has a merge conflict.');
              return;
            }

            async function postConflictFeedback() {
              await upsertFeedback(
                `### Your branch has a merge conflict\n\n` +
                `Hi @${pullRequest.user.login}, your contributor entry is valid, but another ` +
                `contribution was merged into \`main\` after you created your branch. Git cannot ` +
                `decide how to combine both edits to the same part of \`Contributors.md\`. Update ` +
                `your branch from the original repository's \`main\`, keep every contributor once, ` +
                `remove the conflict markers, and preserve alphabetical order. Push the resolution ` +
                `to this same branch; you do not need a new pull request.` +
                copilotPrompt(
                  `Resolve the merge conflict in my current pull request branch. Add ` +
                  `https://github.com/${owner}/${repo}.git as the upstream remote if it is not ` +
                  `already configured, fetch upstream, and merge upstream/main into my current ` +
                  `branch ${pullRequest.head.ref}. In Contributors.md, remove all conflict markers, ` +
                  `keep every contributor exactly once, and keep the names in alphabetical order. ` +
                  `Show me the resolved diff before committing. Then commit the resolution and ` +
                  `push it to my same branch so pull request #${pullNumber} updates.`
                )
              );
            }

            try {
              const result = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pullNumber,
                merge_method: 'squash',
                sha: pullRequest.head.sha
              });

              if (!result.data.merged) {
                throw new Error(result.data.message || 'GitHub did not merge the pull request.');
              }

              await upsertFeedback(
                `### Contribution merged\n\n` +
                `Congratulations @${pullRequest.user.login}! Your contributor entry passed the ` +
                `automated checks and has been merged.`
              );
            } catch (error) {
              const refreshed = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber
              });

              if (refreshed.data.mergeable === false || refreshed.data.mergeable_state === 'dirty') {
                await postConflictFeedback();
                core.setFailed('The pull request developed a merge conflict.');
                return;
              }

              await upsertFeedback(
                `### Maintainer review needed\n\n` +
                `Hi @${pullRequest.user.login}, your contributor entry passed every participant ` +
                `check, but GitHub could not complete the automatic merge. You do not need to open ` +
                `another pull request or force-push your branch. A maintainer will inspect the ` +
                `repository settings and finish the review.`
              );
              throw error;
            }